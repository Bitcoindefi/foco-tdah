<style>
/* =====================================================================
   Design system
   Colour   three palettes, one per moment of the day (morning, afternoon,
            night), each matched to its low-poly scene. Amber is reserved
            for whatever is lit: the primary action, the timer, today.
   Type     Bricolage Grotesque (display) + Atkinson Hyperlegible (text),
            on a 1.25 scale from a 17 px base.
   Space    a 4 px grid: 4, 8, 12, 16, 24, 32, 48, 64.
   World    every working surface is an object in the scene: wooden boards
            (wd) and stone slabs (st). Their face colours here match the
            faces drawn in 3D, so text keeps its contrast in every phase.
   ===================================================================== */
:root{
  --bg:#0c1220; --raise:#121a2d; --raise-2:#18223a; --raise-3:#202c49;
  --line:#222d47; --line-2:#34425f; --line-3:#4d5d82;
  --text:#edf0f8; --muted:#a2adc6; --faint:#7785a3;
  --accent:#ffc15e; --accent-text:#ffd08a; --accent-ink:#1d1503; --wash:rgba(255,193,94,.12); --ring:rgba(255,193,94,.3);
  --focus:#a9c1ff; --danger:#ff9d92; --lilac:#b9a2ff;
  --wd-face:#3b2f2b; --wd-rim:#221b1a; --wd-ink:#f5e9d6; --wd-ink2:#c9b59c; --wd-acc:#ffd08a; --wd-line:rgba(255,230,200,.16); --wd-line2:rgba(255,230,200,.3); --wd-well:rgba(8,5,4,.34); --wd-well2:rgba(8,5,4,.46);
  --st-face:#2a3146; --st-rim:#1a1f30; --st-ink:#edf0f8; --st-ink2:#aab4cc; --st-acc:#ffd08a; --st-line:rgba(220,230,255,.14); --st-line2:rgba(220,230,255,.28); --st-well:rgba(4,6,14,.32); --st-well2:rgba(4,6,14,.44);
  --emboss:rgba(0,0,0,.55); --tile-ink:#e6ebf7; --tile-today:#ffd08a; --tile-halo:rgba(8,12,24,.75);
  --sky:radial-gradient(120% 75% at 50% 18%,#2a3558 0%,#161d33 52%,#0a0e19 100%);
  --mark:#fff4dc;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --t-xs:.8rem; --t-sm:.9rem; --t-md:1rem; --t-lg:1.25rem; --t-xl:1.5625rem; --t-2xl:1.953rem; --t-3xl:2.441rem;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  color-scheme:dark;
}
/* morning: dawn light, warm cream and pale sky */
:root[data-phase="morning"]{
  --bg:#f3e7d6; --raise:#fff8ee; --raise-2:#fbf0e1; --raise-3:#efe0cb;
  --line:#e3d2bb; --line-2:#cdb89c; --line-3:#a58f74;
  --text:#2a2028; --muted:#625560; --faint:#7f7078;
  --accent:#f0a22e; --accent-text:#8a4700; --accent-ink:#1d1503; --wash:rgba(240,162,46,.16); --ring:rgba(240,162,46,.36);
  --focus:#2f58c4; --danger:#a3352b; --lilac:#6a4fd0;
  --wd-face:#cba070; --wd-rim:#8a6440; --wd-ink:#2a1809; --wd-ink2:#4a2f17; --wd-acc:#5a2a00; --wd-line:rgba(60,30,8,.22); --wd-line2:rgba(60,30,8,.42); --wd-well:rgba(255,246,230,.38); --wd-well2:rgba(255,246,230,.55);
  --st-face:#e4dccd; --st-rim:#b3a894; --st-ink:#2c2730; --st-ink2:#544b55; --st-acc:#7a3a00; --st-line:rgba(40,30,30,.16); --st-line2:rgba(40,30,30,.34); --st-well:rgba(255,255,255,.5); --st-well2:rgba(255,255,255,.72);
  --emboss:rgba(255,255,255,.35); --tile-ink:#2c2730; --tile-today:#8a3f00; --tile-halo:rgba(255,250,240,.7);
  --sky:linear-gradient(180deg,#a9cbe3 0%,#cfdde6 30%,#f7d8bb 58%,#f3e7d6 100%);
  --mark:#3a2418;
  color-scheme:light;
}
/* afternoon: high golden sun, saturated colour */
:root[data-phase="afternoon"]{
  --bg:#f6e3bf; --raise:#fffaf0; --raise-2:#fdf1da; --raise-3:#f1dfbd;
  --line:#e6cf9f; --line-2:#cfae73; --line-3:#a7854a;
  --text:#241a10; --muted:#5b4831; --faint:#7d6849;
  --accent:#f0a22e; --accent-text:#7f4300; --accent-ink:#1d1503; --wash:rgba(240,162,46,.18); --ring:rgba(240,162,46,.4);
  --focus:#2457c5; --danger:#a3352b; --lilac:#6a4fd0;
  --wd-face:#c08a52; --wd-rim:#7b5530; --wd-ink:#1f1006; --wd-ink2:#3d2410; --wd-acc:#4a1f00; --wd-line:rgba(50,22,0,.24); --wd-line2:rgba(50,22,0,.44); --wd-well:rgba(255,240,215,.34); --wd-well2:rgba(255,240,215,.52);
  --st-face:#dccfb3; --st-rim:#a99a7c; --st-ink:#261f16; --st-ink2:#4f4230; --st-acc:#6e3400; --st-line:rgba(50,35,10,.18); --st-line2:rgba(50,35,10,.36); --st-well:rgba(255,252,240,.48); --st-well2:rgba(255,252,240,.7);
  --emboss:rgba(255,240,210,.3); --tile-ink:#261f16; --tile-today:#7a3600; --tile-halo:rgba(255,248,232,.7);
  --sky:linear-gradient(180deg,#5fa9db 0%,#9fd0ea 34%,#f3e2b4 70%,#f6e3bf 100%);
  --mark:#2b1a0a;
  color-scheme:light;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:400 var(--t-md)/1.5 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color 1.6s ease,color 1.6s ease}
h1,h2{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(var(--t-xl),6.4vw,var(--t-3xl));line-height:1.08}
h1:focus,h2:focus{outline:none}
p{margin:0}
a{color:var(--accent-text);text-underline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:var(--s2);top:-64px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:var(--s3) var(--s4);border-radius:12px;font-weight:700}
.skip:focus{top:var(--s2)}
svg{display:block}

/* ---------- chrome: the moment of the day, the language, one small link ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) max(var(--s4),env(safe-area-inset-right)) var(--s2) max(var(--s4),env(safe-area-inset-left));
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background-color 1.6s ease}
.top .grow{flex:1}
body[data-view="cover"] .top,body[data-view="home"].world3d .top{position:fixed;left:0;right:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
body[data-view="cover"] .top>*,body[data-view="home"].world3d .top>*{pointer-events:auto}
body[data-view="home"].world3d .top .seg,body[data-view="home"].world3d .top .btn.text,body[data-view="home"].world3d .phase-tag{background:color-mix(in srgb,var(--raise) 84%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body[data-view="home"].world3d .top .btn.text{border-radius:14px;color:var(--text)}
.phase-tag{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 14px 0 10px;border-radius:14px;border:1.5px solid var(--line);
  font:600 var(--t-sm) var(--display);color:var(--text);transition:background-color 1.6s,border-color 1.6s,color 1.6s}
.phase-tag svg{width:22px;height:22px;color:var(--accent-text)}
main{max-width:1180px;margin:0 auto;padding:var(--s3) var(--s4) 120px}
main.full{max-width:none;padding:0}
#v-breath,#v-about{max-width:620px;margin:0 auto}

/* ---------- buttons: one primary per surface, then outline, then text ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:14px;border:1.5px solid transparent;
  font-family:var(--display);font-weight:600;font-size:var(--t-md);letter-spacing:-.005em;line-height:1.15;text-align:center;cursor:pointer;background:none;
  transition:transform .12s ease,background-color .15s,border-color .15s,box-shadow .18s,color .15s}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(1px) scale(.992)}
/* the primary button is shaded like a facet of the bulb: two planes of amber meeting on a diagonal */
.btn.primary{color:var(--accent-ink);background:linear-gradient(158deg,#ffd992 0%,#ffc15e 46%,#f6ae3f 46.4%,#f0a22e 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(120,60,0,.22),0 10px 24px -14px rgba(160,80,0,.9)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(120,60,0,.22),0 14px 30px -12px rgba(200,110,10,.95)}
.btn.primary:active{transform:translateY(1px) scale(.992)}
.btn.secondary{color:var(--text);border-color:var(--line-2)}
.btn.secondary:hover{border-color:var(--line-3);background:var(--raise)}
.btn.text{color:var(--muted);padding:0 var(--s3);font-weight:500;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:5px}
.btn.text:hover{color:var(--text);text-decoration-color:currentColor}
.btn.text.danger{color:var(--danger)}
.btn.huge{width:100%;min-height:64px;font-size:var(--t-lg);border-radius:18px;padding:0 var(--s5)}
.btn.mini{min-height:44px;padding:0 14px;font-size:var(--t-sm);border-radius:12px}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line-2);background:var(--raise);color:var(--text);cursor:pointer;
  transition:border-color .15s,background-color .15s,color .15s,transform .12s}
.icon-btn:hover{border-color:var(--line-3);background:var(--raise-2)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.bare{border-color:transparent;background:none;color:var(--muted)}
.icon-btn.bare:hover{color:var(--text);background:var(--raise)}
.pair{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-top:var(--s3)}
.back{display:inline-flex;align-items:center;gap:var(--s1);min-height:44px;margin:0 0 var(--s4) -6px;padding:0 var(--s3) 0 var(--s1);border:0;border-radius:10px;background:none;color:var(--muted);font:600 var(--t-sm) var(--display);cursor:pointer;transition:color .15s}
.back:hover{color:var(--text)}
.back svg{width:20px;height:20px}

/* segmented control */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:14px;background:var(--raise);border:1.5px solid var(--line)}
.seg button{min-width:52px;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:none;color:var(--muted);font:600 var(--t-sm) var(--display);cursor:pointer;
  transition:background-color .15s,color .15s,box-shadow .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--wash);color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s4);margin:var(--s5) 0}
.seg-row .label{margin:0}
.seg.wrap{flex-wrap:wrap}

/* ---------- text fields ---------- */
.label{display:block;margin:var(--s5) 0 var(--s2);font-size:var(--t-sm);font-weight:700;color:var(--muted)}
.hint{color:var(--muted);font-size:var(--t-sm);line-height:1.45}
.input{display:block;width:100%;min-height:52px;padding:0 var(--s4);border-radius:14px;border:1.5px solid var(--line-2);background:var(--raise);color:var(--text);
  appearance:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .18s,background-color .15s}
textarea.input{min-height:88px;padding:14px var(--s4);line-height:1.45;resize:none;font-size:var(--t-md)}
.input::placeholder,.field-go input::placeholder{color:var(--faint);opacity:1}
.input:hover{border-color:var(--line-3)}
.input:focus{outline:none;border-color:var(--accent);background:var(--raise-2);box-shadow:0 0 0 4px var(--ring)}
input[type="date"].input{font-variant-numeric:tabular-nums}
/* a field with its own action: the arrow lights up once there is something to send */
.field-go{display:flex;align-items:center;gap:var(--s1);padding:4px 4px 4px var(--s4);border-radius:16px;border:1.5px solid var(--line-2);background:var(--raise);
  transition:border-color .15s,box-shadow .18s,background-color .15s}
.field-go:hover{border-color:var(--line-3)}
.field-go:focus-within{border-color:var(--accent);background:var(--raise-2);box-shadow:0 0 0 4px var(--ring)}
.field-go input{flex:1;min-width:0;min-height:44px;border:0;outline:none;background:none;color:var(--text);padding:0}
.field-go button{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:12px;cursor:pointer;color:var(--accent-ink);
  background:linear-gradient(158deg,#ffd992 0%,#ffc15e 46%,#f6ae3f 46.4%,#f0a22e 100%);transition:transform .12s,background .15s,color .15s,opacity .15s}
.field-go button svg{width:20px;height:20px}
.field-go button:active{transform:scale(.94)}
.field-go input:placeholder-shown+button{background:var(--raise-3);color:var(--faint)}
.field-go.big{padding:6px 6px 6px var(--s5);border-radius:20px}
.field-go.big input{min-height:56px;font-size:var(--t-lg)}
.field-go.big button{width:56px;height:56px;border-radius:15px}
.field-go.big button svg{width:24px;height:24px}
/* switch */
.switch{display:flex;align-items:center;gap:var(--s3);min-height:48px;cursor:pointer;color:var(--muted)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:var(--raise-2);border:1.5px solid var(--line-2);transition:background-color .15s,border-color .15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:transform .16s ease,background-color .15s}
.switch input:checked+i{background:var(--wash);border-color:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px);background:var(--accent)}
.switch input:focus-visible+i{outline:2px solid var(--focus);outline-offset:3px}

/* ---------- cover: the island under the sky of the moment ---------- */
.cover{position:relative;min-height:100dvh;display:grid;align-content:end;justify-items:center;overflow:hidden;color:var(--text);background:var(--sky);transition:background 1.6s ease}
#cover-gl{position:absolute;inset:0}
#cover-gl canvas,#world-gl canvas{display:block;width:100%;height:100%}
#cover-body{position:relative;z-index:1;width:100%;max-width:560px;padding:46vh var(--s5) max(var(--s6),env(safe-area-inset-bottom));text-align:center}
.cover.flat #cover-body{padding-top:14vh}
.cover-icon{display:none;width:min(44vw,180px);margin:0 auto var(--s3)}
.cover.flat .cover-icon{display:block}
.wordmark{display:flex;align-items:center;justify-content:center;gap:.2em;font-family:var(--display);font-size:clamp(3.2rem,15.5vw,5.6rem);font-weight:800;letter-spacing:-.045em;line-height:.95;color:var(--mark)}
.wordmark svg{width:.6em;height:auto;flex:none}
.cover.flat .wordmark svg{display:none}
.cv-tag{margin-top:var(--s4);font-family:var(--display);font-size:clamp(var(--t-lg),4.6vw,var(--t-xl));font-weight:600;letter-spacing:-.015em;color:var(--accent-text)}
.cv-sub{margin:var(--s2) auto var(--s5);max-width:40ch;color:var(--muted)}
.cover .btn.huge{max-width:340px}
.cv-note{margin-top:var(--s5);color:var(--muted);font-size:var(--t-xs)}

/* ---------- breathing: a faceted orb ---------- */
.breath{min-height:calc(100dvh - 160px);display:grid;justify-items:center;align-content:center;gap:var(--s1);text-align:center}
.b-intro{color:var(--muted);margin-bottom:var(--s4)}
.orb-wrap{position:relative;width:min(60vw,240px);aspect-ratio:1;display:grid;place-items:center;margin:var(--s2) 0 var(--s5)}
.orb-wrap::before{content:"";position:absolute;inset:8%;border-radius:50%;background:#f0a22e;filter:blur(36px);opacity:.34}
.orb-guide{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--line-2)}
.orb{position:relative;width:100%;height:100%;transform:scale(.5);
  clip-path:polygon(50% 0%,75% 6.7%,93.3% 25%,100% 50%,93.3% 75%,75% 93.3%,50% 100%,25% 93.3%,6.7% 75%,0% 50%,6.7% 25%,25% 6.7%);
  background:conic-gradient(from 15deg,#ffd98f 0 30deg,#f0a22e 0 60deg,#ffc869 0 90deg,#e9961f 0 120deg,#ffe2a6 0 150deg,#f0a22e 0 180deg,#ffcf7a 0 210deg,#e08e1a 0 240deg,#ffc15e 0 270deg,#f5ab3a 0 300deg,#ffe2a6 0 330deg,#eb9a24 0 360deg);
  transition:transform var(--d,4s) cubic-bezier(.45,0,.35,1)}
.orb[data-p="inhale"],.orb[data-p="hold"]{transform:scale(1)}
.orb[data-p="exhale"],.orb[data-p="ready"]{transform:scale(.5)}
.b-phase{font-family:var(--display);font-size:clamp(var(--t-2xl),9vw,var(--t-3xl));font-weight:700;letter-spacing:-.025em;line-height:1.05}
.b-hint{color:var(--muted);min-height:1.5em}
.b-count{font-family:var(--display);font-size:var(--t-lg);font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.b-cycle{color:var(--faint);font-size:var(--t-sm);margin-bottom:var(--s4)}
html[data-motion="reduce"] .orb{transform:scale(.82)!important}
html[data-motion="reduce"] .orb[data-p="exhale"],html[data-motion="reduce"] .orb[data-p="ready"]{opacity:.45}

/* =====================================================================
   The world. With WebGL, the home screen is one top-down low-poly island.
   Each working surface (.plate) is laid on an object of the scene and
   moves and scales with the camera. The DOM order stays the reading
   order, so the keyboard and screen readers go through it as a page.
   ===================================================================== */
.world{position:relative}
.world:not(.flat){position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.world.drag{cursor:grabbing}
#world-gl{position:absolute;inset:0}
.world.flat #world-gl,.world.flat .hud,.world.flat #cal-grid,.world.flat .world-note{display:none}
#world-ui{position:absolute;inset:0;overflow:hidden;overflow:clip;pointer-events:none}
.world.flat #world-ui{position:static;overflow:visible;pointer-events:auto;display:flex;flex-direction:column;gap:var(--s5);padding-bottom:var(--s6)}

/* ---------- state ---------- */
let S = null;
const ui = { view: 'cover', step: 'pick', lastStep: '', task: null, month: '', day: '', open: {}, drift: '', fly: null, wipe: false, refocus: null, place: 'loop', phase: 'night' };
const store = {
  ok: true, mem: {},
  get(k) { try { return localStorage.getItem(k); } catch (e) { this.ok = false; return this.mem[k] || null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.ok = false; this.mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } delete this.mem[k]; }
};
const fresh = () => ({ v: 5, lang: 'pt', phaseMode: 'auto', motion: 'auto', skipBreath: false, min: 10, tasks: [], goals: [], focus: {}, sample: false });
const save = () => store.set(KEY, JSON.stringify(S));
const mk = o => Object.assign({ id: uid(), t: '', step: '', done: false, date: '', goalId: '', created: Date.now() }, o);
function normalise(o) {
  const s = Object.assign(fresh(), o);
  s.v = 5;
  s.tasks = (Array.isArray(s.tasks) ? s.tasks : []).filter(x => x && x.t).map(x => { const k = mk(x); k.done = !!k.done; if (k.done && !isDate(k.date)) k.date = dayKey(); return k; });
  s.goals = (Array.isArray(s.goals) ? s.goals : []).filter(g => g && g.t).map(g => ({ id: g.id || uid(), t: g.t, due: isDate(g.due) ? g.due : '', done: !!g.done }));
  const f = {};
  if (s.focus && typeof s.focus === 'object') Object.keys(s.focus).forEach(k => { if (isDate(k) && +s.focus[k] > 0) f[k] = Math.round(+s.focus[k]); });
  s.focus = f;
  if (!I18N[s.lang]) s.lang = 'pt';
  if (!['auto'].concat(PHASES).includes(s.phaseMode)) s.phaseMode = 'auto';
  delete s.theme;
  if (!['auto', 'reduce', 'full'].includes(s.motion)) s.motion = 'auto';
  if (!DURATIONS.includes(s.min)) s.min = 10;
  return s;
}
/* first run: a small made-up list and two weeks of made-up lights, so the calendar is not empty */
function seed() {
  S.tasks = [
    mk({ t: L('Responder ao e-mail da senhoria', "Reply to the landlady's email") }),
    mk({ t: L('Arrumar a secretária', 'Tidy the desk') }),
    mk({ t: L('Ligar à junta de freguesia', 'Call the parish council') }),
    mk({ t: L('Regar as plantas', 'Water the plants'), done: true, date: dayKey() })
  ];
  S.goals = [{ id: uid(), t: L('Entregar a candidatura', 'Submit the application'), due: dayPlus(9), done: false }];
  S.focus = {};
  [50, 20, 0, 75, 35, 10, 0, 0, 60, 25, 40, 0, 15, 30].forEach((m, i) => { if (m) S.focus[dayPlus(-(i + 1))] = m * 60; });
  S.sample = true;
}
function load() {
  let s = null;
  try { s = JSON.parse(store.get(KEY) || 'null'); } catch (e) { s = null; }
  if (s && typeof s === 'object' && Array.isArray(s.tasks)) { S = normalise(s); return; }
  S = fresh(); seed(); save();
}

/* ---------- i18n ---------- */
function t(k, v) {
  const D = I18N[S && S.lang] || I18N.pt;
  let s = D[k];
  if (s == null) s = I18N.pt[k];
  if (s == null) return k;
  return v ? s.replace(/\{(\w+)\}/g, (m, n) => (v[n] != null ? v[n] : m)) : s;
}
function tn(k, n, v) { const kk = k + '_' + n; return I18N.pt[kk] != null ? t(kk, v) : t(k, v); }
const tx = v => (v && typeof v === 'object') ? (v[S.lang] || v.pt || v.en || '') : (v || '');
const loc = () => S.lang === 'pt' ? 'pt-PT' : 'en-GB';
const fmtDate = d => new Intl.DateTimeFormat(loc(), { day: 'numeric', month: 'long' }).format(new Date(d + 'T12:00:00'));
const fmtMonth = m => cap(new Intl.DateTimeFormat(loc(), { month: 'long', year: 'numeric' }).format(new Date(m + '-01T12:00:00')));
/* morning, afternoon or night: from the clock, or fixed from "About" to preview a scene */
const phase = () => S.phaseMode === 'auto' ? phaseAt(new Date()) : S.phaseMode;
const reduced = () => S.motion === 'reduce' || (S.motion === 'auto' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- selectors ---------- */
const byId = id => S.tasks.find(x => x.id === id);
const pending = () => S.tasks.filter(x => !x.done);
/* what a date has earned: focus seconds, tasks done, and how many of its lights are on */
function dayStats(d) {
  const sec = S.focus[d] || 0, done = S.tasks.filter(x => x.done && x.date === d).length;
  return { sec, min: Math.round(sec / 60), done, lit: Math.min(LIGHTS, Math.ceil(sec / (LIGHT_MIN * 60)) + done) };
}

/* ---------- the tiny first step: keyword rules, always editable ---------- */
const FIRST = [
  [/e-?mail|responder|reply|mensagem|message|escrever [aà]|write to/i, 'fs_mail'],

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 4200);
}

/* ---------- the focus session ---------- */
const T = { id: null, total: 0, left: 0, endsAt: 0, running: false, ended: false, elapsed: 0, logged: 0, lit0: 0 };
let tick = null, lastActive = Date.now(), hiddenAt = 0;
const stopTick = () => { clearInterval(tick); tick = null; };
/* focus time is written to today's date; the lights around that date read from it */
function commitFocus() {
  const add = T.elapsed - T.logged;
  if (T.id && add > 0) { const k = dayKey(); S.focus[k] = (S.focus[k] || 0) + add; T.logged = T.elapsed; }
}
function startSession(task) {
  if (!task || task.done) return;
  commitFocus(); stopTick();
  const secs = S.min * 60;
  Object.assign(T, { id: task.id, total: secs, left: secs, endsAt: Date.now() + secs * 1000, running: true, ended: false, elapsed: 0, logged: 0, lit0: dayStats(dayKey()).lit });
  Object.assign(ui, { task: task.id, step: 'focus', drift: '', fly: null });
  lastActive = Date.now(); hiddenAt = document.hidden ? Date.now() : 0;
  tick = setInterval(onTick, 250);
  save(); render(); toStage();
}
function onTick() {
  if (!T.running) return;
  const now = Date.now(), prev = T.left;
  T.left = Math.max(0, Math.ceil((T.endsAt - now) / 1000));
  /* the gentle nudge: the tab went away, or nothing has touched the page for a while */
  if (!ui.drift) {
    if (document.hidden) { if (hiddenAt && now - hiddenAt >= AWAY_S * 1000) setDrift('away'); }
    else if (now - lastActive >= IDLE_S * 1000) setDrift('idle');
  }
  if (T.left === prev) return;
  T.elapsed += prev - T.left;
  if (T.elapsed - T.logged >= 20) { commitFocus(); save(); }
  paintClock();
  if (T.left <= 0) { T.running = false; T.ended = true; ui.drift = ''; stopTick(); commitFocus(); save(); render(); }
}
function setDrift(kind) { ui.drift = kind; ui.refocus = '[data-act="here"]'; render(); }
/* one tap anywhere brings the light back */
function here() { if (!ui.drift) return; ui.drift = ''; lastActive = Date.now(); render(); }
function pauseSession() { if (!T.running) return; T.running = false; ui.drift = ''; stopTick(); commitFocus(); save(); render(); }
function resumeSession() {
  if (T.running || !T.id || T.left <= 0) return;
  T.endsAt = Date.now() + T.left * 1000; T.running = true; lastActive = Date.now();
  stopTick(); tick = setInterval(onTick, 250); render();
}
function moreTime(mins) {
  if (!T.id) return;
  Object.assign(T, { total: mins * 60, left: mins * 60, endsAt: Date.now() + mins * 60000, running: true, ended: false });

const BREATH = [['inhale', 4], ['hold', 2], ['exhale', 6]], CYCLES = 3;

/* the island: a faceted plateau around the working area, sloping to sand and sea */
function islandH(x, z) {

/* ---------- the boards: wood planks or a stone slab, sized to the HTML laid on them ---------- */

    const top = new THREE.Mesh(flatPlane(w + 0.26, d + 0.26), m.stoneFace); top.position.y = PLAZA_Y + 0.005; b.g.add(top);

/* ---------- wiring ---------- */
function bindEvents() {
  document.addEventListener('click', e => {
    if (ui.drift && T.id && ui.view === 'home') { here(); return; }      // while the light is low, any tap means "I'm here" and nothing else
    const el = e.target.closest ? e.target.closest('[data-act]') : null;

  document.addEventListener('input', e => { const el = e.target, f = el.dataset && BIND[el.dataset.bind]; if (f) f(el.value); });

  let day = dayKey();
