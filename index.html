<!doctype html>
<html lang="pt-PT" data-theme="auto" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="EnFoco: o teu dia em foquitos, um de cada vez. Protótipo de hackathon para adultos com PHDA. Não é uma ferramenta médica.">
<title>EnFoco — um foquito de cada vez</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151b2e'/%3E%3Ccircle cx='16' cy='13' r='8' fill='%23ffc15e'/%3E%3Crect x='12' y='21' width='8' height='6' rx='2' fill='%239aa3b8'/%3E%3C/svg%3E">

     so if the CDN or WebGL is unavailable the page still works with the simple 2D view. -->

    "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
/* ---------- tokens ---------- */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#1c2333; --muted:#566076; --line:#d5dbe5;
  --amber:#f0a22e; --amber-ink:#7a4a00; --amber-wash:#fff2d9; --on-amber:#1d1503; --on-amber-2:#4a3407;
  --primary:#1c2333; --on-primary:#ffffff; --link:#7a4a00; --focus:#2a6df4; --danger:#a3352b;
  --font:"Avenir Next","Segoe UI Variable Text","Segoe UI",Seravek,"Gill Sans Nova",Ubuntu,Calibri,"Helvetica Neue",system-ui,sans-serif;
  --r:16px; --r-sm:12px; --tap:48px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141e; --surface:#171e2c; --surface-2:#1e2738; --ink:#e8edf5; --muted:#a6b1c5; --line:#2c374b;
    --amber:#ffc15e; --amber-ink:#ffd08a; --amber-wash:#2c2513; --on-amber:#1d1503; --on-amber-2:#4a3407;
    --primary:#e8edf5; --on-primary:#141a27; --link:#ffd08a; --focus:#8fb4ff; --danger:#ff9d92;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141e; --surface:#171e2c; --surface-2:#1e2738; --ink:#e8edf5; --muted:#a6b1c5; --line:#2c374b;
  --amber:#ffc15e; --amber-ink:#ffd08a; --amber-wash:#2c2513; --on-amber:#1d1503; --on-amber-2:#4a3407;
  --primary:#e8edf5; --on-primary:#141a27; --link:#ffd08a; --focus:#8fb4ff; --danger:#ff9d92;
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1{font-size:clamp(1.55rem,5vw,2rem);line-height:1.15;font-weight:650;letter-spacing:-.015em;margin:.1em 0 .25em}
h2{font-size:1.08rem;line-height:1.3;font-weight:650;margin:0 0 .45rem}
h3{font-size:1rem;font-weight:650;margin:0 0 .2rem}
p{margin:.4em 0}
ul{margin:.3em 0;padding-left:1.2em}
a{color:var(--link);text-underline-offset:.15em}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1:focus{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
.skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:10px}
.skip:focus{top:8px}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px max(12px,env(safe-area-inset-left)) 8px max(12px,env(safe-area-inset-right));
  background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 8px 0 4px;border:0;background:none;cursor:pointer;
  font-weight:700;font-size:1.12rem;letter-spacing:-.01em;border-radius:10px}
.brand svg{width:26px;height:26px;flex:none}
.tools{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{min-width:44px;min-height:44px;border:0;background:none;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.icon-btn svg{width:20px;height:20px}
#demo-banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;justify-content:center;padding:8px 14px;
  background:var(--amber-wash);color:var(--ink);border-bottom:1px solid var(--line);font-size:.93rem}
#demo-banner button{min-height:40px}
main{max-width:680px;margin:0 auto;padding:14px 16px 110px}
.lead{color:var(--muted);font-size:1.04rem;max-width:56ch;margin:0 0 .6em}
.note{color:var(--muted);font-size:.93rem}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 2px;margin:0 0 2px -4px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-radius:10px}
.back svg{width:20px;height:20px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:var(--r-sm);
  border:1px solid transparent;background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
.btn.quiet{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.lit{background:var(--amber);color:var(--on-amber)}
.btn.danger{background:none;color:var(--danger);border-color:currentColor}
.btn.ghost{background:none;color:var(--muted);border-color:transparent;padding:0 10px;min-width:44px}
.btn.mini{min-height:44px;padding:0 12px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row.center{justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--amber-wash);border-color:var(--amber);color:var(--amber-ink);box-shadow:inset 0 0 0 1px var(--amber)}
.field{margin:12px 0}
.lbl{display:block;font-size:.9rem;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=time],input[type=date],input[type=number],input:not([type]),select,textarea{
  width:100%;min-height:var(--tap);padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{resize:vertical;line-height:1.45}
::placeholder{color:var(--muted);opacity:.8}
.check{display:flex;align-items:center;gap:10px;min-height:var(--tap);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--amber);flex:none}
.grid3{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
@media(min-width:520px){.grid3{grid-template-columns:1fr 1fr 1fr}}

/* ---------- blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.panel.calm{background:var(--amber-wash);border-color:transparent}
.blk{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:16px}
details>summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:650;border-radius:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none;margin:0 4px 0 2px}
details[open]>summary::before{transform:rotate(45deg)}
.sum-v{font-weight:400;color:var(--muted);font-size:.95rem}
details.why{margin-top:10px}
details.why>summary{font-weight:600;font-size:.92rem;color:var(--muted)}
details.why p{font-size:.93rem;color:var(--muted);max-width:62ch}
details.why .src{font-size:.88rem}
details.more>summary{font-weight:600;color:var(--muted);font-size:.95rem}
.plain{list-style:none;padding:0;margin:0}
.bullets{padding-left:1.2em;list-style:disc}
.bullets li{margin:.35em 0;max-width:64ch}

/* ---------- breathing ---------- */
.breath{min-height:calc(100dvh - 150px);display:grid;justify-items:center;align-content:center;gap:6px;text-align:center}
.b-intro{color:var(--muted);margin-bottom:14px}
.orb-wrap{position:relative;width:min(62vw,250px);aspect-ratio:1;display:grid;place-items:center;margin:6px 0 14px}
.orb-guide{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--line)}
.orb{width:100%;height:100%;border-radius:50%;transform:scale(.5);
  background:radial-gradient(circle at 50% 40%,#ffe7b5 0%,var(--amber) 58%,#d98a14 100%);
  box-shadow:0 0 70px -10px var(--amber);transition:transform var(--d,4s) cubic-bezier(.45,0,.35,1)}
.orb[data-p="inhale"],.orb[data-p="hold"]{transform:scale(1)}
.orb[data-p="exhale"],.orb[data-p="ready"]{transform:scale(.5)}
.b-phase{font-size:clamp(1.9rem,8vw,2.6rem);font-weight:650;letter-spacing:-.02em;margin:0;line-height:1.1}
.b-hint{color:var(--muted);margin:0;min-height:1.5em}
.b-count{font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--amber-ink);font-weight:650;margin:2px 0 0}
.b-cycle{color:var(--muted);font-size:.93rem;margin:0 0 8px}
.breath .why{text-align:left;max-width:520px}
html[data-motion="reduce"] .orb{transform:scale(.82)!important}
html[data-motion="reduce"] .orb[data-p="exhale"],html[data-motion="reduce"] .orb[data-p="ready"]{opacity:.45}

/* ---------- menu ---------- */
.menu{display:grid;gap:10px;margin-top:14px}
.m-item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;width:100%;min-height:68px;padding:13px 14px 13px 16px;text-align:left;
  border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.m-item b{font-weight:650;font-size:1.05rem}
.m-item span{grid-column:1;color:var(--muted);font-size:.93rem;line-height:1.35}
.m-item svg{grid-column:2;grid-row:1/3;width:20px;height:20px;color:var(--muted)}
.m-item.lit{background:var(--amber);border-color:transparent;color:var(--on-amber);min-height:92px}
.m-item.lit b{font-size:1.3rem}
.m-item.lit span,.m-item.lit svg{color:var(--on-amber-2)}
@media(min-width:600px){.menu{grid-template-columns:1fr 1fr}.m-item.lit{grid-column:1/-1}}
.lights{margin-top:18px}

/* ---------- stage (always dusk, in both themes, so the bulbs can glow) ---------- */
.stage{position:relative;height:clamp(220px,34vh,330px);border-radius:20px;overflow:hidden;margin:6px 0 4px;scroll-margin-top:72px;
  background:radial-gradient(120% 95% at 50% 0%,#28324f 0%,#161c30 55%,#0c101b 100%);color:#dfe6f5}
#stage-gl{position:absolute;inset:0}
#stage-gl canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#stage-labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,0);max-width:120px;padding:2px 7px;border-radius:7px;font-size:.74rem;line-height:1.25;text-align:center;
  background:rgba(10,14,25,.6);color:#cfd8ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.lab.sel{color:#ffd08a;background:rgba(10,14,25,.82);font-weight:650;max-width:160px;z-index:2}
.lab.done{opacity:.6}
.stage-count{position:absolute;left:12px;top:8px;margin:0;font-size:.82rem;color:#b9c4dc}
.stage-note{position:absolute;right:12px;bottom:8px;left:12px;margin:0;font-size:.78rem;color:#9daac6;text-align:right}
#stage-2d{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px 4px;padding:36px 8px 4px}
.stage.flat{height:auto;min-height:200px}
.stage.flat .stage-note{position:static;padding:4px 14px 12px;text-align:center}
.stage.flat #stage-gl,.stage.flat #stage-labels{display:none}
.b2{width:84px;min-height:104px;padding:6px 4px;border:0;border-radius:12px;background:none;color:#cfd8ea;cursor:pointer;display:grid;justify-items:center;gap:3px;font-size:.74rem;line-height:1.2}
.b2.sel{background:rgba(255,255,255,.07);color:#ffd08a}
.b2-bulb{position:relative;width:38px;height:44px;border-radius:50% 50% 46% 46%;background:#59627b;margin-bottom:9px}
.b2-bulb::after{content:"";position:absolute;left:11px;right:11px;bottom:-9px;height:10px;border-radius:2px 2px 4px 4px;background:#8d96ab}
.b2.st-idle .b2-bulb,.b2.st-warm .b2-bulb{background:#b99a62}
.b2.st-paused .b2-bulb,.b2.st-rest .b2-bulb{background:#c9a258;box-shadow:0 0 10px 0 rgba(255,193,94,.35)}
.b2.st-focus .b2-bulb{background:#ffd27a;box-shadow:0 0 26px 6px rgba(255,193,94,.7)}
.b2.st-done .b2-bulb{background:#454d63}
.b2-n{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* wide screens: the room stays in view on the left while the day scrolls on the right */
@media(min-width:980px){
  main.wide{max-width:1160px}
  #v-day:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0 32px;align-items:start}
  .day-left{position:sticky;top:74px}
  .day-left .stage:not(.flat){height:min(62vh,560px)}
  #day-body>.blk:first-child{margin-top:0;border-top:0;padding-top:0}
}

/* ---------- now panel ---------- */
.now{border-left:5px solid var(--line)}
.now.run{border-color:var(--amber);border-left-color:var(--amber);box-shadow:0 14px 40px -22px var(--amber)}
.now-l{margin:0;font-size:.9rem;font-weight:650;color:var(--amber-ink)}
.now-t{margin:.1em 0 .25em;font-size:clamp(1.3rem,4.6vw,1.6rem);font-weight:650;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tagm{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.pips{display:inline-flex;gap:2px;align-items:flex-end}
.pips i{width:4px;height:9px;border-radius:1px;background:var(--line)}
.pips i:nth-child(2){height:12px}.pips i:nth-child(3){height:15px}
.pips i.on{background:var(--amber-ink)}
.hint{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.95rem}
.hint.warm{background:var(--amber-wash)}
.timer{display:flex;align-items:center;gap:16px;margin:12px 0 4px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .trk{stroke:var(--line)}
.ring .prg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:1.75rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t-side{min-width:0}
.t-side p{margin:.15em 0}
.t-mode{font-weight:650}
.steps{list-style:none;padding:0;margin:8px 0 0}
.steps .check{min-height:44px}
.steps input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.boost{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.bo{padding:10px 0;border-top:1px dashed var(--line)}
.bo:first-of-type{border-top:0}
.bo h3{display:flex;align-items:center;gap:8px}
.ltr{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--amber-wash);color:var(--amber-ink);font-size:.9rem;font-weight:700}
.bo p{margin:.2em 0 .5em;color:var(--muted);font-size:.95rem}
.card-twist{display:inline-block;padding:10px 14px;border-radius:12px;border:1px dashed var(--amber);background:var(--amber-wash);color:var(--ink)!important;font-weight:600}
.swatch{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}

/* ---------- plan ---------- */
.tlist{list-style:none;padding:0;margin:6px 0}
.trow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;min-height:60px;padding:8px 0 8px 10px;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.trow.sel{border-left-color:var(--amber);background:linear-gradient(90deg,var(--amber-wash),transparent 70%)}
.t-time{font-variant-numeric:tabular-nums;font-weight:600}
.t-title svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.t-main{min-width:0;display:grid;gap:2px}
.t-title{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.86rem;color:var(--muted)}
.trow.done .t-title{color:var(--muted);font-weight:500}
.t-act{display:flex;align-items:center;gap:2px}
.nowmark{font-size:.84rem;font-weight:650;color:var(--amber-ink);padding:0 8px}
.add{margin-top:14px}
.sub{font-size:.95rem;font-weight:650;color:var(--muted);margin:14px 0 2px}

/* ---------- rhythm, goals ---------- */
.rh-bar{position:relative;display:flex;height:16px;border-radius:999px;overflow:hidden;margin:26px 0 4px;border:1px solid var(--line)}
.rh-bar span{display:block;height:100%}
.rh-bar .b1{flex:5;background:var(--amber-wash)}
.rh-bar .b2x{flex:6;background:var(--surface-2);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.rh-bar .b3{flex:5;background:var(--surface)}
.rh-wrap{position:relative}
.rh-now{position:absolute;top:-22px;transform:translateX(-50%);font-size:.8rem;font-weight:650;color:var(--amber-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.rh-now::after{content:"";position:absolute;left:50%;top:20px;width:3px;height:22px;margin-left:-1.5px;border-radius:2px;background:var(--amber-ink)}
.rh-leg{display:flex;font-size:.82rem;color:var(--muted)}
.rh-leg span:nth-child(1){flex:5}.rh-leg span:nth-child(2){flex:6}.rh-leg span:nth-child(3){flex:5}
.goal{padding:10px 0;border-bottom:1px solid var(--line)}
.stones{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.stones i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.stones i.on{background:var(--amber);border-color:var(--amber)}
.stones i.next{border-color:var(--amber-ink);border-style:dashed}

/* ---------- dump, together, demo ---------- */
.dump{list-style:none;padding:0;margin:8px 0}
.d-item{border-bottom:1px solid var(--line);padding:6px 0}
.d-item.sel{background:var(--amber-wash);border-radius:12px;padding:8px 12px;border-bottom-color:transparent;margin:6px 0}
.d-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.d-t{overflow-wrap:anywhere;font-weight:550}
.d-step{padding:6px 0 4px}
.co-line{display:flex;align-items:center;gap:10px;margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.co-dot{width:12px;height:12px;border-radius:50%;background:#7fb8ee;flex:none;box-shadow:0 0 0 4px rgba(127,184,238,.25)}
.personas{list-style:none;padding:0;margin:10px 0;display:grid;gap:12px}
.persona{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.persona.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.persona p{max-width:60ch}
.srcs{list-style:none;padding:0}
.srcs li{margin:.6em 0;max-width:66ch}
.srcs span{display:block;color:var(--muted);font-size:.93rem}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:40;max-width:min(92vw,520px);
  padding:12px 16px;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:550;text-align:center;

const $ = (s, r = document) => r.querySelector(s);

const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const DAY = 864e5;
const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hm = (d = new Date()) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const sod = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmt = s => { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const L = (pt, en) => ({ pt, en });
function dur(m) { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? h + ' h ' + pad(r) : h + ' h') : r + ' min'; }
/* a clock time some minutes from now, rounded to the quarter hour; empty if it would fall on another day */
function hmPlus(mins) { const d = new Date(Date.now() + mins * 60000); d.setMinutes(Math.round(d.getMinutes() / 15) * 15, 0, 0); return dayKey(d) === dayKey() ? hm(d) : ''; }

function autoSteps(m) {
  return (m > 25 ? ['st_prep', 'st_part1', 'st_break', 'st_part2', 'st_close'] : ['st_easy', 'st_finish']).map(k => ({ k, t: '', d: false }));
}
function mk(o) {
  const x = Object.assign({
    id: uid(), t: '', m: 15, e: 2, h: '', done: false, doneAt: 0, later: 0, laterAt: 0, created: Date.now(),
    tag: '', from: '', why: '', spice: '', twist: -1, best: 0, last: 0, started: false, shelved: false, goalId: '', n: ''
  }, o);
  x.m = Math.max(1, +x.m || 15);
  x.e = Math.min(3, Math.max(1, +x.e || 2));
  x.steps = Array.isArray(o.steps) ? o.steps.filter(s => s && (s.k || s.t)).map(s => ({ k: s.k || '', t: s.t || '', d: !!s.d })) : [];
  if (!x.steps.length) x.steps = autoSteps(x.m);
  return x;
}
function normalise(o) {
  const s = Object.assign(fresh(), o);
  s.tasks = (Array.isArray(s.tasks) ? s.tasks : []).filter(x => x && typeof x === 'object').map(mk);
  s.dump = (Array.isArray(s.dump) ? s.dump : []).filter(x => x && x.t).map(x => ({ id: x.id || uid(), t: x.t, created: x.created || Date.now() }));
  s.goals = (Array.isArray(s.goals) ? s.goals : []).filter(g => g && g.t && g.due).map(g => ({ id: g.id || uid(), t: g.t, due: String(g.due), parts: Math.max(1, +g.parts || 1), done: Math.max(0, +g.done || 0) }));
  s.sessions = Array.isArray(s.sessions) ? s.sessions.slice(0, 20) : [];
  s.share = Object.assign({ task: true, time: true }, s.share);
  if (!I18N[s.lang]) s.lang = 'pt';
  return s;
}

/* tasks from the first prototype (localStorage key "foco") are carried over once, minus its own sample tasks */
function migrateOld() {
  try {
    const o = JSON.parse(store.get(OLD_KEY) || 'null');
    if (!o || !Array.isArray(o.tasks)) return false;
    const samples = ['Tomar la medicación', 'Responder mails importantes', 'Ordenar el escritorio'];
    const mine = o.tasks.filter(x => x && x.t && !samples.includes(x.t));
    if (!mine.length) return false;
    S.tasks = mine.map(x => mk({ t: String(x.t), m: +x.m || 15, e: +x.e || 2, h: x.h || '', done: !!x.done, steps: (x.steps || []).map(s => ({ t: String(s), d: !!x.done })) }));
    S.lights = +o.streak || 0;
    return true;
  } catch (e) { return false; }
}
function load() {
  let s = null;
  try { s = JSON.parse(store.get(KEY) || 'null'); } catch (e) { s = null; }
  if (s && s.v === 2) { S = normalise(s); return; }
  S = fresh();
  if (!migrateOld()) seedDefault();
  S.lastSeen = Date.now();
  save();
}

function t(k, v) {

  if (s == null) s = I18N.pt[k];
  if (s == null) return k;
  return v ? s.replace(/\{(\w+)\}/g, (m, n) => (v[n] != null ? v[n] : m)) : s;
}
const tx = v => (v && typeof v === 'object') ? (v[S.lang] || v.pt || v.en || '') : (v || '');

function tt(k, v) { const kk = k + '_' + tone(); return I18N.pt[kk] != null ? t(kk, v) : t(k, v); }

/* ---------- selectors over the day ---------- */
const byId = id => S.tasks.find(x => x.id === id);
const todays = () => S.tasks.filter(x => !x.shelved);
const openTasks = () => todays().filter(x => !x.done);
const ordered = list => list.slice().sort((a, b) => (a.h || '99:99').localeCompare(b.h || '99:99'));
const planMode = () => S.plan === 'auto' ? (heavy() ? 'base' : 'ideal') : S.plan;
const effMin = x => planMode() === 'base' ? Math.min(x.m, 10) : x.m;
const stepText = s => s.k ? t(s.k) : tx(s.t);
const paused = () => S.pauseDay === dayKey();

function suggest() {
  let o = ordered(openTasks());
  if (!o.length) return null;
  const recent = o.filter(x => !(x.laterAt && Date.now() - x.laterAt < 30 * 60000));
  if (recent.length) o = recent;
  if (heavy()) return o.slice().sort((a, b) => (a.e - b.e) || (a.m - b.m))[0];
  const fit = o.filter(x => x.e <= S.energy);
  if (S.mood === 'wind') { const fun = fit.find(x => x.tag || x.spice); if (fun) return fun; }
  return fit[0] || o.slice().sort((a, b) => a.m - b.m)[0];
}
function cur() {
  if (T.id) { const x = byId(T.id); if (x && !x.done && !x.shelved) return x; }
  const s = S.sel && S.tasks.find(x => x.id === S.sel && !x.done && !x.shelved);
  return s || suggest();
}
function baseSet(c) {
  const rest = openTasks().filter(x => !c || x.id !== c.id).sort((a, b) => (a.e - b.e) || (a.m - b.m));
  return (c ? [c] : []).concat(rest.slice(0, c ? 1 : 2));
}

/* ---------- timer (one for the whole app) ---------- */
const T = { id: null, mode: '', total: 0, left: 0, endsAt: 0, running: false, ended: false, elapsed: 0, half: false, target: 0, pausedAt: 0, comp: '' };
let tick = null;
const stopTick = () => { clearInterval(tick); tick = null; };
function startTimer(task, mode, secs, extra) {
  stopTick();
  Object.assign(T, { id: task.id, mode, total: secs, left: secs, endsAt: Date.now() + secs * 1000, running: true, ended: false, elapsed: 0, half: false, target: 0, pausedAt: 0, comp: '' }, extra || {});
  S.sel = task.id; save();
  tick = setInterval(onTick, 250);
  render();
}
function onTick() {
  if (!T.running) return;
  const prev = T.left;
  T.left = Math.max(0, Math.ceil((T.endsAt - Date.now()) / 1000));
  if (T.left === prev) return;
  T.elapsed += prev - T.left;
  paintTimer();
  if (!T.half && T.total >= 240 && T.left <= T.total / 2 && T.left > 0) { T.half = true; toast(T.mode === 'tog' ? t('tg_half') : tt('toast_half')); }
  if (T.left <= 0) { T.running = false; T.ended = true; stopTick(); notify(t(T.mode === 'two' ? 'ended_two' : 'toast_end')); render(); }
}
function pauseTimer() { if (!T.running) return; T.running = false; T.pausedAt = Date.now(); stopTick(); render(); }
function resumeTimer() {
  if (T.running || !T.id || T.left <= 0) return;
  const away = T.pausedAt ? Date.now() - T.pausedAt : 0;
  T.endsAt = Date.now() + T.left * 1000; T.running = true; T.ended = false;
  stopTick(); tick = setInterval(onTick, 250);
  if (away > 5 * 60000) toast(t('toast_back'));
  render();
}
function extendTimer(mins) {
  if (!T.id) return;
  T.left = mins * 60; T.total = mins * 60; T.endsAt = Date.now() + T.left * 1000; T.running = true; T.ended = false; T.half = true;
  if (T.mode === 'two') T.mode = 'focus';
  stopTick(); tick = setInterval(onTick, 250);
  render();
}
function clearTimer() { stopTick(); Object.assign(T, { id: null, mode: '', total: 0, left: 0, endsAt: 0, running: false, ended: false, elapsed: 0, half: false, target: 0, pausedAt: 0, comp: '' }); }
const RING_C = 2 * Math.PI * 56;
function paintTimer() {
  const v = $('#v-' + ui.view); if (!v) return;
  const el = $('.js-time', v), ring = $('.js-ring', v);
  if (T.id && el) el.textContent = fmt(T.left);
  if (T.id && ring && T.total) ring.style.strokeDashoffset = (RING_C * (1 - T.left / T.total)).toFixed(2);
  const co = $('.js-co', v); if (co) { const txt = companionLine(); if (co.textContent !== txt) co.textContent = txt; }
}
function modeLabel() {
  if (T.mode === 'two') return t('mode_two');
  if (T.mode === 'sprint') return t('mode_sprint');
  if (T.mode === 'chal') return t('mode_chal', { time: fmt(T.target) });
  if (T.mode === 'tog') return t('mode_tog', { name: t('co_' + T.comp) });
  return t('mode_focus');
}

/* ---------- things the day does on its own ---------- */
/* anything planned for a time that has gone by simply becomes "whenever": no overdue state exists */
function replan(silent) {
  const edge = new Date(Date.now() - 15 * 60000);
  if (dayKey(edge) !== dayKey()) return 0;
  const lim = hm(edge); let moved = 0;
  openTasks().forEach(x => { if (x.h && x.h < lim) { x.h = ''; moved++; } });
  if (moved) { S.replanDay = dayKey(); save(); if (!silent) toast(t('toast_replan')); }
  return moved;
}
/* called on load: new day housekeeping and the gentle return after a gap */
function arrive() {
  const last = S.lastSeen || Date.now();
  const gap = Math.max(0, Math.round((sod(Date.now()) - sod(last)) / DAY));
  if (gap >= 1) {
    S.tasks = S.tasks.filter(x => !x.done);
    S.tasks.forEach(x => { x.h = ''; x.n = ''; x.laterAt = 0; });
    S.sel = null; S.replanDay = '';
  }
  ui.gap = gap;
  ui.showReturn = gap >= GAP_DAYS && S.tasks.some(x => !x.done);
  if (ui.showReturn) { ui.retOff = 0; prepareReturn(); }
  S.lastSeen = Date.now(); save();
}
function prepareReturn() {
  const all = S.tasks.filter(x => !x.done).sort((a, b) => (a.e - b.e) || (a.m - b.m));
  const n = all.length, picks = [];
  for (let i = 0; i < Math.min(3, n); i++) picks.push(all[(ui.retOff + i) % n]);
  all.forEach(x => { x.shelved = !picks.includes(x); x.h = ''; });
  ui.ret = picks.map(x => x.id); S.sel = null; save();
}

const BREATH = [['inhale', 4], ['hold', 2], ['exhale', 6]], CYCLES = 3;
const B = { on: false, cycle: 0, phase: 0, left: 0, iv: null, shown: false };
function startBreath() {
  stopBreath();
  Object.assign(B, { on: true, cycle: 0, phase: 0, left: BREATH[0][1], shown: false });
  B.iv = setInterval(breathTick, 1000);
  requestAnimationFrame(() => requestAnimationFrame(() => { B.shown = true; paintBreath(); }));
}
function stopBreath() { clearInterval(B.iv); B.iv = null; B.on = false; }
function breathTick() {
  B.left--;

    B.phase++;
    if (B.phase >= BREATH.length) { B.phase = 0; B.cycle++; if (B.cycle >= CYCLES) { stopBreath(); nav('menu'); return; } }
    B.left = BREATH[B.phase][1];

  paintBreath();
}
function paintBreath() {
  const orb = $('#orb'); if (!orb) return;

  $('#b-hint').textContent = t('b_' + p + '_h');

  $('#b-cycle').textContent = t('b_cycle', { n: B.cycle + 1, total: CYCLES });
}

function rhythmBlock(c) {

  const inDay = mins >= a && mins < b, pct = Math.min(100, Math.max(0, (mins - a) / (b - a) * 100));
  const blk = mins < 12 * 60 ? 'morning' : mins < 18 * 60 ? 'afternoon' : 'evening', end = mins < 12 * 60 ? 12 * 60 : mins < 18 * 60 ? 18 * 60 : b;
  const set = paused() ? [] : (planMode() === 'base' ? baseSet(c) : openTasks());
  const planned = set.reduce((n, x) => n + effMin(x), 0), room = Math.max(0, b - mins);
  const fit = !planned ? t('rh_none') : planned <= room * 0.6 ? t('rh_fits', { min: planned }) : planned <= room ? t('rh_tight', { min: planned }) : t('rh_over', { min: planned });
  const est = S.tasks.filter(x => x.last >= 30).slice(-3);
  return `<section class="blk" aria-labelledby="rh-h">
    <h2 id="rh-h">${t('rh_title')}</h2>

  </section>`;
}
function goalLine(g) {
  const days = Math.round((sod(new Date(g.due + 'T12:00:00').getTime()) - sod(Date.now())) / DAY), rem = Math.max(0, g.parts - g.done);

/* ---------- chrome, render, navigation ---------- */
const VIEWS = { breath: vBreath, menu: vMenu, day: vDay, dump: vDump, together: vTogether, demo: vDemo, privacy: vPrivacy, vision: vVision };
function paintChrome() {
  const h = document.documentElement;
  h.lang = S.lang === 'pt' ? 'pt-PT' : 'en';

  const bm = $('#btn-motion'); bm.setAttribute('aria-label', t('motion_' + S.motion)); bm.title = t('motion_' + S.motion);

  else { db.hidden = true; db.innerHTML = ''; }
}
function focusKey() {
  const a = document.activeElement;
  if (!a || a === document.body || !a.dataset) return null;
  if (a.id) return '#' + a.id;
  if (a.dataset.act) return `[data-act="${a.dataset.act}"]` + (a.dataset.id ? `[data-id="${a.dataset.id}"]` : '') + (a.dataset.v != null ? `[data-v="${a.dataset.v}"]` : '');
  if (a.dataset.chg) return `[data-chg="${a.dataset.chg}"]` + (a.dataset.k ? `[data-k="${a.dataset.k}"]` : '') + (a.dataset.i ? `[data-i="${a.dataset.i}"]` : '');
  return null;
}
function render() {
  paintChrome();
  const v = ui.view;
  $$('.view').forEach(s => { s.hidden = s.id !== 'v-' + v; });
  $('#main').classList.toggle('wide', v === 'day');
  const host = v === 'day' ? $('#day-body') : $('#v-' + v);
  $$('.view').forEach(s => { if (s.hidden) { const body = s.id === 'v-day' ? $('#day-body') : s; if (body.firstChild) body.innerHTML = ''; } });
  const fk = host.contains(document.activeElement) ? focusKey() : null;
  host.innerHTML = VIEWS[v]();
  if (ui.refocus) { const el = $(ui.refocus, host); if (el) el.focus({ preventScroll: true }); ui.refocus = null; }
  else if (fk) { let el = null; try { el = $(fk, host); } catch (e) { el = null; } if (el) el.focus({ preventScroll: true }); }
  refreshOut();
  if (v === 'breath') paintBreath();
  syncScene();
}
function nav(v) {
  if (!VIEWS[v]) v = 'menu';
  if (ui.view === 'breath' && v !== 'breath') stopBreath();
  ui.view = v; ui.wipe = false;
  if (v === 'breath') startBreath();
  render();
  window.scrollTo(0, 0);
  const h = $('#v-' + v + ' h1'); if (h) h.focus({ preventScroll: true });
  try { if (v !== 'breath' && location.hash.slice(1) !== v) location.hash = v; } catch (e) { /* hash is a convenience only */ }
}
async function copyFrom(id) {
  const el = $('#' + id); if (!el) return;
  try { await navigator.clipboard.writeText(el.value); toast(t('copied')); }
  catch (e) { el.focus(); el.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) { ok = false; } toast(t(ok ? 'copied' : 'copy_manual')); }
}

/* ---------- task actions ---------- */
function doneTask(id) {
  const x = byId(id); if (!x || x.done) return;
  x.done = true; x.doneAt = Date.now(); x.started = true; x.steps.forEach(s => { s.d = true; });
  S.lights++;
  let msg = tt('toast_done');
  if (T.id === id) {
    const el = T.elapsed;
    if (T.mode === 'chal' && T.target) msg = el <= T.target ? t('toast_chal_win', { time: fmt(el) }) : t('toast_chal_ok');
    else if (el >= 30 && x.best && el < x.best) msg = t('toast_best', { time: fmt(el) });
    if (el >= 30) { x.last = el; if (!x.best || el < x.best) x.best = el; }
    clearTimer();
  }
  if (x.goalId) { const g = S.goals.find(k => k.id === x.goalId); if (g) g.done = Math.min(g.parts, g.done + 1); }
  if (S.sel === id) S.sel = null;
  save(); toast(msg); render();
}
function laterTask(id) {
  const x = byId(id); if (!x) return;
  S.tasks.splice(S.tasks.indexOf(x), 1); S.tasks.push(x);
  x.h = ''; x.later = (x.later || 0) + 1; x.laterAt = Date.now();
  if (T.id === id) { if (T.elapsed >= 60) x.started = true; clearTimer(); }
  if (S.sel === id) S.sel = null;
  save(); toast(t('toast_later')); render();
}
/* make a task the current one; a timer left on another task is closed quietly */
function choose(id) {
  const x = byId(id); if (!x) return null;
  if (T.id && T.id !== x.id) { const o = byId(T.id); if (o && T.elapsed >= 60) o.started = true; clearTimer(); }
  S.sel = x.id; return x;
}
function startTwo(x) { if (!x) return; startTimer(x, 'two', 120); showRoom(); }
/* on narrow screens, bring the room into view so the bulb can be seen lighting up */
function showRoom() {
  const st = $('#stage'); if (!st || ui.view !== 'day') return;
  const r = st.getBoundingClientRect();
  if (r.top < 60 || r.bottom > window.innerHeight) st.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });
}

const ACT = {
  nav: d => nav(d.v),
  lang: d => { if (I18N[d.v]) { S.lang = d.v; save(); render(); } },
  theme: () => { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme] || 'auto'; save(); paintChrome(); toast(t('theme_' + S.theme)); },
  motion: () => { S.motion = { auto: 'reduce', reduce: 'full', full: 'auto' }[S.motion] || 'auto'; save(); paintChrome(); syncScene(); toast(t('motion_' + S.motion)); },
  skipBreath: () => nav('menu'),
  twoMenu: () => { const c = cur(); if (S.pauseDay) S.pauseDay = ''; if (c) { ui.view = 'day'; startTwo(c); nav('day'); } else nav('day'); },
  select: d => { if (choose(d.id)) { save(); render(); } },
  start: d => { const x = byId(d.id) || cur(); if (x) { startTimer(x, 'focus', effMin(x) * 60); showRoom(); } },
  two: d => startTwo(byId(d.id) || cur()),
  pause: () => pauseTimer(),
  resume: () => { resumeTimer(); showRoom(); },
  more: d => extendTimer(+d.v || 5),
  stopHere: () => { const x = byId(T.id); if (x) x.started = true; clearTimer(); save(); toast(t('toast_stop')); render(); },
  done: d => doneTask(d.id || (cur() || {}).id),
  later: d => laterTask(d.id || (cur() || {}).id),
  del: d => { if (T.id === d.id) clearTimer(); if (S.sel === d.id) S.sel = null; S.tasks = S.tasks.filter(x => x.id !== d.id); save(); render(); },
  energy: d => { S.energy = +d.v; S.checkinDay = dayKey(); save(); render(); },
  mood: d => { S.mood = d.v; S.checkinDay = dayKey(); save(); render(); },
  plan: d => { S.plan = d.v; save(); render(); },
  pauseDay: () => { if (paused()) S.pauseDay = ''; else { S.pauseDay = dayKey(); clearTimer(); } save(); render(); },
  spice: d => { const c = cur(); if (!c) return; c.spice = c.spice === d.v ? '' : d.v; save(); render(); },
  twist: () => { const c = cur(); if (!c) return; let n = Math.floor(Math.random() * TWISTS); if (n === c.twist) n = (n + 1) % TWISTS; c.twist = n; save(); render(); },
  glow: d => { S.glow = +d.v; save(); render(); },
  challenge: () => { const c = cur(); if (!c) return; const target = c.best ? c.best : Math.round(effMin(c) * 60 * 0.8); startTimer(c, 'chal', Math.max(effMin(c) * 60, target), { target }); showRoom(); },
  sprint: d => { const c = cur(); if (c) { startTimer(c, 'sprint', (+d.v || 5) * 60); showRoom(); } },
  focusAdd: () => { const el = $('#a-t'); if (el) { el.scrollIntoView({ block: 'center' }); el.focus({ preventScroll: true }); } },
  shelfBack: d => { const x = byId(d.id); if (x) { x.shelved = false; save(); render(); } },
  goalStep: d => {
    const g = S.goals.find(k => k.id === d.id); if (!g) return;
    let x = S.tasks.find(k => k.goalId === g.id && !k.done);
    if (!x) {
      const n = g.done + 1, name = typeof g.t === 'object' ? L(g.t.pt + ', ' + I18N.pt.go_part.replace('{n}', n), g.t.en + ', ' + I18N.en.go_part.replace('{n}', n)) : g.t + ', ' + t('go_part', { n });
      x = mk({ t: name, m: 15, e: 2, goalId: g.id }); S.tasks.push(x);
    }
    x.shelved = false; choose(x.id); save(); toast(t('toast_added')); render();
    const p = $('#now-t'); if (p) p.scrollIntoView({ block: 'center' });
  },
  goalDel: d => { S.goals = S.goals.filter(g => g.id !== d.id); save(); render(); },
  dumpPick: d => { if (ui.pick === d.id) { ui.pick = null; ui.fs = ''; } else { const k = S.dump.find(x => x.id === d.id); ui.pick = d.id; ui.fs = k ? firstStep(tx(k.t)) : ''; ui.refocus = '#fs-in'; } render(); },
  dumpRandom: () => { if (!S.dump.length) return; const k = S.dump[Math.floor(Math.random() * S.dump.length)]; ui.pick = k.id; ui.fs = firstStep(tx(k.t)); ui.refocus = '#fs-in'; render(); const el = $('#fs-in'); if (el) el.scrollIntoView({ block: 'center' }); },
  dumpDel: d => { S.dump = S.dump.filter(x => x.id !== d.id); if (ui.pick === d.id) ui.pick = null; save(); render(); },
  dumpToday: d => { const x = dumpToTask(d.id); if (x) { choose(x.id); save(); toast(t('du_moved')); render(); } },

    S.pauseDay = ''; ui.tg.what = '';

  tgEnd: () => { T.running = false; T.ended = true; stopTick(); ui.refocus = '#wrap-in'; render(); },

    clearTimer(); store.del(KEY); store.del(OLD_KEY);

const CHG = {

  const tip = new THREE.Mesh(R.geo.tip, R.mat.tip); tip.position.y = 0.12; vis.add(tip);

  [-0.11, 0.11].forEach(x => { const p = new THREE.Mesh(R.geo.post, R.mat.post); p.position.set(x, 0.81, 0); vis.add(p); });

/* a gentle zig-zag across the screen; a new row every five bulbs */

    u.fil.color.copy(done ? new scene3.THREE.Color(0x4a5268) : scene3.glow);

function sync3D(items) {
  const R = scene3, THREE = R.THREE, ids = new Set(items.map(i => i.id));
  R.glow.set(GLOWS[glowIndex()][1]); R.halo.material.color.copy(R.glow); R.lamp.color.copy(R.glow);
  R.bulbs.forEach((b, id) => { if (!ids.has(id)) { dropBulb(b); R.bulbs.delete(id); } });
  const pos = layout(items.length), still = reduced();
  items.forEach((it, i) => {
    let b = R.bulbs.get(it.id), fresh = false;
    if (!b) { b = makeBulb(it.id); R.bulbs.set(it.id, b); R.root.add(b.group); fresh = true; }
    b.pos = pos[i]; b.group.position.set(pos[i][0], 0, pos[i][2]);

function fitCamera() {

  if (!pts.length) pts.push([0, 0, 0], [0, 1.85, 0]);

function placeLabels() {

  let html = '';
  R.bulbs.forEach(b => {
    const it = b.item, text = it.sel ? it.title : it.state === 'done' ? '✓' : it.time;
    if (!text) return;
    v.set(b.pos[0], 0, b.pos[2]).project(R.cam);
    const x = Math.min(w - 34, Math.max(34, (v.x + 1) / 2 * w)), y = (1 - v.y) / 2 * h + 0.5 * R.unit + 3;
    html += `<span class="lab${it.sel ? ' sel' : ''}${it.state === 'done' ? ' done' : ''}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px">${esc(text)}</span>`;

  const anim = !reduced();

  R.bulbs.forEach(b => {

    if (Math.abs(d) > 0.004) { b.cur = anim ? b.cur + d * 0.07 : b.target; moving = true; applyGlow(b); }
    else if (b.cur !== b.target) { b.cur = b.target; moving = true; applyGlow(b); }

/* optional GLB: try once; on any failure the bulbs drawn in code stay */
async function loadModel(THREE) {

    const { GLTFLoader } = await import('three/examples/jsm/loaders/GLTFLoader.js');
    const gltf = await new Promise((res, rej) => new GLTFLoader().load(MODEL_PATH, res, undefined, rej));

/* ---------- wiring ---------- */

  });
  document.addEventListener('change', e => { const el = e.target, f = el.dataset && CHG[el.dataset.chg]; if (f) f(el); });
  document.addEventListener('input', e => { const el = e.target, f = el.dataset && BIND[el.dataset.bind]; if (f) f(el.value); });
  document.addEventListener('submit', e => { const f = e.target.dataset && FORMS[e.target.dataset.form]; if (f) { e.preventDefault(); f(e.target, e.submitter); } });
  document.addEventListener('keydown', e => {
