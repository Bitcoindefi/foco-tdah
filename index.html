<style>
/* =====================================================================
   Design system
   Colour   the night of the low-poly scene, and one warm light. Amber is
            reserved for whatever is lit: the primary action, the timer, today.
   Type     Bricolage Grotesque (display) + Atkinson Hyperlegible (text),
            on a 1.25 scale from a 17 px base.
   Space    a 4 px grid: 4, 8, 12, 16, 24, 32, 48, 64.
   ===================================================================== */
:root{
  --bg:#0c1220; --raise:#121a2d; --raise-2:#18223a; --raise-3:#202c49;
  --line:#222d47; --line-2:#34425f; --line-3:#4d5d82;
  --text:#edf0f8; --muted:#a2adc6; --faint:#7785a3;
  --accent:#ffc15e; --accent-text:#ffd08a; --accent-ink:#1d1503; --wash:rgba(255,193,94,.12); --ring:rgba(255,193,94,.26);
  --focus:#a9c1ff; --danger:#ff9d92; --lilac:#b9a2ff;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --t-xs:.8rem; --t-sm:.9rem; --t-md:1rem; --t-lg:1.25rem; --t-xl:1.5625rem; --t-2xl:1.953rem; --t-3xl:2.441rem;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef1f6; --raise:#ffffff; --raise-2:#f6f8fb; --raise-3:#e9edf4;
  --line:#d9dfea; --line-2:#bcc6d8; --line-3:#8f9bb3;
  --text:#141b2c; --muted:#515d77; --faint:#687490;
  --accent:#f0a22e; --accent-text:#8a5200; --accent-ink:#1d1503; --wash:rgba(240,162,46,.16); --ring:rgba(240,162,46,.34);
  --focus:#2b5fd9; --danger:#a3352b; --lilac:#6a4fd0;
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root[data-theme="auto"]{
    --bg:#eef1f6; --raise:#ffffff; --raise-2:#f6f8fb; --raise-3:#e9edf4;
    --line:#d9dfea; --line-2:#bcc6d8; --line-3:#8f9bb3;
    --text:#141b2c; --muted:#515d77; --faint:#687490;
    --accent:#f0a22e; --accent-text:#8a5200; --accent-ink:#1d1503; --wash:rgba(240,162,46,.16); --ring:rgba(240,162,46,.34);
    --focus:#2b5fd9; --danger:#a3352b; --lilac:#6a4fd0;
    color-scheme:light;
  }
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:400 var(--t-md)/1.5 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(var(--t-xl),6.4vw,var(--t-3xl));line-height:1.08}
h1:focus{outline:none}
p{margin:0}
a{color:var(--accent-text);text-underline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:var(--s2);top:-64px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:var(--s3) var(--s4);border-radius:12px;font-weight:700}
.skip:focus{top:var(--s2)}
svg{display:block}

/* ---------- chrome: language and one small link. The logo lives only on the cover. ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:flex-end;align-items:center;gap:var(--s2);
  padding:var(--s2) max(var(--s4),env(safe-area-inset-right)) var(--s2) max(var(--s4),env(safe-area-inset-left));
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body[data-view="cover"] .top{position:absolute;left:0;right:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
main{max-width:1180px;margin:0 auto;padding:var(--s3) var(--s4) 120px}
main.full{max-width:none;padding:0}
#v-breath,#v-about{max-width:620px;margin:0 auto}

/* ---------- buttons: one primary per screen, then outline, then text ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:14px;border:1.5px solid transparent;
  font-family:var(--display);font-weight:600;font-size:var(--t-md);letter-spacing:-.005em;line-height:1.15;text-align:center;cursor:pointer;background:none;
  transition:transform .12s ease,background-color .15s,border-color .15s,box-shadow .18s,color .15s}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(1px) scale(.992)}
/* the primary button is shaded like a facet of the bulb: two planes of amber meeting on a diagonal */
.btn.primary{color:var(--accent-ink);background:linear-gradient(158deg,#ffd992 0%,#ffc15e 46%,#f6ae3f 46.4%,#f0a22e 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 30px -16px rgba(240,162,46,.95)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 16px 36px -14px rgba(240,162,46,1)}
.btn.primary:active{transform:translateY(1px) scale(.992)}
.btn.secondary{color:var(--text);border-color:var(--line-2)}
.btn.secondary:hover{border-color:var(--line-3);background:var(--raise)}
.btn.text{color:var(--muted);padding:0 var(--s3);font-weight:500;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:5px}
.btn.text:hover{color:var(--text);text-decoration-color:currentColor}
.btn.text.danger{color:var(--danger)}
.btn.huge{width:100%;min-height:64px;font-size:var(--t-lg);border-radius:18px;padding:0 var(--s5)}
.btn.mini{min-height:44px;padding:0 14px;font-size:var(--t-sm);border-radius:12px}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line-2);background:var(--raise);color:var(--text);cursor:pointer;
  transition:border-color .15s,background-color .15s,color .15s,transform .12s}
.icon-btn:hover{border-color:var(--line-3);background:var(--raise-2)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.bare{border-color:transparent;background:none;color:var(--faint)}
.icon-btn.bare:hover{color:var(--text);background:var(--raise)}
.pair{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-top:var(--s3)}
.back{display:inline-flex;align-items:center;gap:var(--s1);min-height:44px;margin:0 0 var(--s4) -6px;padding:0 var(--s3) 0 var(--s1);border:0;border-radius:10px;background:none;color:var(--muted);font:600 var(--t-sm) var(--display);cursor:pointer;transition:color .15s}
.back:hover{color:var(--text)}
.back svg{width:20px;height:20px}

/* segmented control */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:14px;background:var(--raise);border:1.5px solid var(--line)}
.seg button{min-width:52px;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:none;color:var(--muted);font:600 var(--t-sm) var(--display);cursor:pointer;
  transition:background-color .15s,color .15s,box-shadow .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--wash);color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s4);margin:var(--s5) 0}
.seg-row .label{margin:0}

/* ---------- text fields ---------- */
.label{display:block;margin:var(--s5) 0 var(--s2);font-size:var(--t-sm);font-weight:700;color:var(--muted)}
.hint{color:var(--muted);font-size:var(--t-sm);line-height:1.45}
.input{display:block;width:100%;min-height:52px;padding:0 var(--s4);border-radius:14px;border:1.5px solid var(--line-2);background:var(--raise);color:var(--text);
  appearance:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .18s,background-color .15s}
textarea.input{min-height:88px;padding:14px var(--s4);line-height:1.45;resize:none;font-size:var(--t-md)}
.input::placeholder,.field-go input::placeholder{color:var(--faint);opacity:1}
.input:hover{border-color:var(--line-3)}
.input:focus{outline:none;border-color:var(--accent);background:var(--raise-2);box-shadow:0 0 0 4px var(--ring)}
input[type="date"].input{font-variant-numeric:tabular-nums}
/* a field with its own action: the arrow lights up once there is something to send */
.field-go{display:flex;align-items:center;gap:var(--s1);padding:4px 4px 4px var(--s4);border-radius:16px;border:1.5px solid var(--line-2);background:var(--raise);
  transition:border-color .15s,box-shadow .18s,background-color .15s}
.field-go:hover{border-color:var(--line-3)}
.field-go:focus-within{border-color:var(--accent);background:var(--raise-2);box-shadow:0 0 0 4px var(--ring)}
.field-go input{flex:1;min-width:0;min-height:44px;border:0;outline:none;background:none;color:var(--text);padding:0}
.field-go button{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:12px;cursor:pointer;color:var(--accent-ink);
  background:linear-gradient(158deg,#ffd992 0%,#ffc15e 46%,#f6ae3f 46.4%,#f0a22e 100%);transition:transform .12s,background .15s,color .15s,opacity .15s}
.field-go button svg{width:20px;height:20px}
.field-go button:active{transform:scale(.94)}
.field-go input:placeholder-shown+button{background:var(--raise-3);color:var(--faint)}
.field-go.big{padding:6px 6px 6px var(--s5);border-radius:20px}
.field-go.big input{min-height:56px;font-size:clamp(1.05rem,4.6vw,var(--t-lg))}
.field-go.big button{width:56px;height:56px;border-radius:15px}
.field-go.big button svg{width:24px;height:24px}
/* switch */
.switch{display:flex;align-items:center;gap:var(--s3);min-height:48px;cursor:pointer;color:var(--muted)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:var(--raise-2);border:1.5px solid var(--line-2);transition:background-color .15s,border-color .15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:transform .16s ease,background-color .15s}
.switch input:checked+i{background:var(--wash);border-color:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px);background:var(--accent)}
.switch input:focus-visible+i{outline:2px solid var(--focus);outline-offset:3px}

/* ---------- cover ---------- */
.cover{position:relative;min-height:100dvh;display:grid;align-content:end;justify-items:center;overflow:hidden;color:#edf0f8;
  background:radial-gradient(120% 75% at 50% 18%,#2a3558 0%,#161d33 52%,#0a0e19 100%)}
#cover-gl{position:absolute;inset:0}
#cover-gl canvas,#stage-gl canvas{display:block;width:100%;height:100%}
#cover-body{position:relative;z-index:1;width:100%;max-width:560px;padding:46vh var(--s5) max(var(--s6),env(safe-area-inset-bottom));text-align:center}
.cover.flat #cover-body{padding-top:14vh}
.cover-icon{display:none;width:min(44vw,180px);margin:0 auto var(--s3)}
.cover.flat .cover-icon{display:block}
.wordmark{display:flex;align-items:center;justify-content:center;gap:.2em;font-family:var(--display);font-size:clamp(3.2rem,15.5vw,5.6rem);font-weight:800;letter-spacing:-.045em;line-height:.95;color:#fff4dc}
.wordmark svg{width:.6em;height:auto;flex:none}
.cover.flat .wordmark svg{display:none}
.cv-tag{margin-top:var(--s4);font-family:var(--display);font-size:clamp(var(--t-lg),4.6vw,var(--t-xl));font-weight:600;letter-spacing:-.015em;color:#ffd08a}
.cv-sub{margin:var(--s2) auto var(--s5);max-width:40ch;color:#b6c0d8}
.cover .btn.huge{max-width:340px}
.cv-note{margin-top:var(--s5);color:#8f9bb6;font-size:var(--t-xs)}

/* ---------- breathing: a faceted orb ---------- */
.breath{min-height:calc(100dvh - 160px);display:grid;justify-items:center;align-content:center;gap:var(--s1);text-align:center}
.b-intro{color:var(--muted);margin-bottom:var(--s4)}
.orb-wrap{position:relative;width:min(60vw,240px);aspect-ratio:1;display:grid;place-items:center;margin:var(--s2) 0 var(--s5)}
.orb-wrap::before{content:"";position:absolute;inset:8%;border-radius:50%;background:#f0a22e;filter:blur(36px);opacity:.34}
.orb-guide{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--line-2)}
.orb{position:relative;width:100%;height:100%;transform:scale(.5);
  clip-path:polygon(50% 0%,75% 6.7%,93.3% 25%,100% 50%,93.3% 75%,75% 93.3%,50% 100%,25% 93.3%,6.7% 75%,0% 50%,6.7% 25%,25% 6.7%);
  background:conic-gradient(from 15deg,#ffd98f 0 30deg,#f0a22e 0 60deg,#ffc869 0 90deg,#e9961f 0 120deg,#ffe2a6 0 150deg,#f0a22e 0 180deg,#ffcf7a 0 210deg,#e08e1a 0 240deg,#ffc15e 0 270deg,#f5ab3a 0 300deg,#ffe2a6 0 330deg,#eb9a24 0 360deg);
  transition:transform var(--d,4s) cubic-bezier(.45,0,.35,1)}
.orb[data-p="inhale"],.orb[data-p="hold"]{transform:scale(1)}
.orb[data-p="exhale"],.orb[data-p="ready"]{transform:scale(.5)}
.b-phase{font-family:var(--display);font-size:clamp(var(--t-2xl),9vw,var(--t-3xl));font-weight:700;letter-spacing:-.025em;line-height:1.05}
.b-hint{color:var(--muted);min-height:1.5em}
.b-count{font-family:var(--display);font-size:var(--t-lg);font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.b-cycle{color:var(--faint);font-size:var(--t-sm);margin-bottom:var(--s4)}
html[data-motion="reduce"] .orb{transform:scale(.82)!important}
html[data-motion="reduce"] .orb[data-p="exhale"],html[data-motion="reduce"] .orb[data-p="ready"]{opacity:.45}

/* ---------- home: stage + the loop + the list ---------- */
#v-home:not([hidden]){display:flex;flex-direction:column;gap:var(--s5)}
.home-stage{order:2;min-width:0}
#loop{order:1;min-width:0}
#list{order:3;min-width:0}
#v-home.lamp .home-stage,#v-home[data-step="done"] .home-stage{order:0}
#v-home[data-step="focus"] #list{display:none}
.cal-bar{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.cal-month{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:var(--t-md)}
#v-home.lamp .cal-bar,#v-home.lamp #day-info{display:none}
#day-info{margin-top:var(--s2)}
/* the stage is always night, in both themes, so the lights can glow */
.stage{position:relative;height:clamp(250px,40vh,360px);border-radius:24px;overflow:hidden;scroll-margin-top:68px;color:#dfe6f5;
  background:radial-gradient(120% 95% at 50% 0%,#28324f 0%,#161c30 55%,#0b0f1a 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.05);transition:box-shadow .6s ease}
#v-home[data-step="focus"]:not(.dim) .stage{box-shadow:0 0 0 1.5px rgba(255,193,94,.45),0 36px 110px -46px rgba(255,170,60,.75)}
#stage-gl{position:absolute;inset:0}
#stage-gl canvas{touch-action:none}
#v-home:not(.lamp) #stage-gl canvas{cursor:grab}
#v-home:not(.lamp) #stage-gl canvas.drag{cursor:grabbing}
#stage-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;font-family:var(--display)}
#v-home.lamp #stage-labels,#v-home.lamp .zoom{display:none}
.lab{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;line-height:1.05;font-weight:700;color:#dfe6f5;text-shadow:0 1px 2px rgba(5,8,16,.85);font-variant-numeric:tabular-nums;will-change:transform}
.lab small{display:none;font-size:.58em;font-weight:600;color:#ffd08a;margin-top:1px}
#stage-labels.zoomed .lab small{display:block}
.lab.out{opacity:.36}
.lab.today{color:#ffd08a}
.lab.sel{color:#fff}
.lab.wd{color:#9daac6;font-weight:600;font-size:.7em}
.zoom{position:absolute;right:var(--s3);bottom:var(--s3);z-index:3;display:flex;gap:6px}
.zoom .icon-btn{border-color:rgba(255,255,255,.14);background:rgba(11,15,26,.72);color:#edf0f8}
.zoom .icon-btn:hover{background:rgba(24,34,58,.9);border-color:rgba(255,255,255,.3)}
.stage-note{position:absolute;left:var(--s4);right:var(--s4);top:var(--s3);font-size:var(--t-xs);color:#9daac6;pointer-events:none;text-shadow:0 1px 2px rgba(5,8,16,.8)}
.stage.flat{height:auto;min-height:220px}
.stage.flat #stage-gl,.stage.flat #stage-labels,.stage.flat .zoom{display:none}
.stage.flat .stage-note{position:static;padding:var(--s1) var(--s4) var(--s3);text-align:center}
#stage-2d{padding:var(--s4) var(--s3) var(--s2)}
.c2d{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.c2-wd{font-size:var(--t-xs);text-align:center;color:#9daac6;padding-bottom:2px}
.c2{position:relative;aspect-ratio:1;min-height:44px;border:0;background:#2c3654;color:#dfe6f5;cursor:pointer;font:700 var(--t-sm) var(--display);
  clip-path:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%)}
.c2.out{background:#1f2740;color:#7f8aa6}
.c2.today{background:#46557f;color:#ffd08a}
.c2[aria-pressed="true"]{background:#5a6a98;color:#fff}
.c2 i{position:absolute;width:5px;height:5px;margin:-2.5px;background:#111729;transform:rotate(45deg)}
.c2 i.on{background:#ffc15e;box-shadow:0 0 5px 1px rgba(255,193,94,.75)}
.lamp2d{width:min(46%,170px);margin:var(--s5) auto;transition:filter .5s,opacity .5s}
.lamp2d.off{filter:grayscale(1) brightness(.5);opacity:.6}
.lamp2d.low{filter:saturate(.6) brightness(.72)}
.lamp2d.on{filter:drop-shadow(0 0 26px rgba(255,193,94,.75))}

/* the loop: type and controls straight on the page, no boxes */
.loop{max-width:560px;width:100%;margin:0 auto}
.loop>*{animation:none}
.loop.enter>*{animation:rise .34s cubic-bezier(.2,.7,.2,1) both}
.loop.enter>*:nth-child(2){animation-delay:.04s}.loop.enter>*:nth-child(3){animation-delay:.08s}.loop.enter>*:nth-child(4){animation-delay:.12s}
.loop.enter>*:nth-child(5){animation-delay:.16s}.loop.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.loop h1+form{margin-top:var(--s5)}
.kicker{font:600 var(--t-sm) var(--display);color:var(--accent-text);margin-bottom:var(--s1)}
.task-t{font-size:clamp(var(--t-xl),5.6vw,var(--t-2xl));overflow-wrap:anywhere}
.task-s{font-size:var(--t-lg);font-weight:600;color:var(--muted);letter-spacing:-.01em;overflow-wrap:anywhere}
.done-t{font-size:clamp(var(--t-3xl),11vw,3.4rem);color:var(--accent-text)}
.lede{margin-top:var(--s3);font-size:var(--t-lg);line-height:1.4;color:var(--muted);max-width:44ch}
.loop .hint{margin-top:var(--s2)}
.loop .btn.huge{margin-top:var(--s4)}
.loop .btn.text{margin-top:var(--s2)}
.picks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.pick{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);width:100%;min-height:58px;padding:var(--s2) var(--s1);border:0;border-bottom:1px solid var(--line);
  background:none;color:var(--text);text-align:left;font-size:var(--t-md);cursor:pointer;transition:padding .16s ease,color .15s}
.pick span{overflow-wrap:anywhere}
.pick svg{width:20px;height:20px;flex:none;color:var(--faint);transition:transform .16s ease,color .15s}
.pick:hover,.pick:focus-visible{padding-left:var(--s3);color:var(--accent-text)}
.pick:hover svg,.pick:focus-visible svg{transform:translateX(4px);color:var(--accent)}
.clock{margin-top:var(--s2);font-family:var(--display);font-weight:700;font-size:clamp(4.2rem,20vw,6.6rem);line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums;transition:color .4s}
#v-home.dim .clock{color:var(--faint)}
.bar{height:4px;margin-top:var(--s3);border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f0a22e,#ffd992);transition:width .9s linear}
.step{margin-top:var(--s4);font-size:var(--t-lg);line-height:1.4;overflow-wrap:anywhere}
.step .label{margin:0 0 var(--s1)}
.status{margin-top:var(--s4);color:var(--muted)}
.nudge{margin-top:var(--s4)}
.nudge p{font-family:var(--display);font-size:var(--t-lg);font-weight:600;line-height:1.3;letter-spacing:-.01em}

/* the list: a drawer between two hairlines */
.drawer{max-width:560px;width:100%;margin:0 auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.drawer>summary{display:flex;align-items:center;gap:var(--s3);min-height:60px;cursor:pointer;list-style:none;border-radius:10px}
.drawer>summary::-webkit-details-marker{display:none}
.sum-t{font-family:var(--display);font-weight:600}
.count{margin-right:auto;color:var(--muted);font-size:var(--t-sm)}
.drawer>summary svg{width:20px;height:20px;color:var(--muted);transition:transform .2s ease}
.drawer[open]>summary svg{transform:rotate(180deg)}
.drawer-in{padding-bottom:var(--s5)}
.drawer h2{margin:var(--s5) 0 var(--s1);font-size:var(--t-sm);font-weight:600;letter-spacing:0;color:var(--muted)}
.drawer form{margin-top:var(--s3)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:var(--s1);min-height:56px;border-bottom:1px solid var(--line)}
.row-t{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s3);overflow-wrap:anywhere;padding:var(--s2) 0}
.row-t svg{width:18px;height:18px;flex:none;color:var(--lilac)}
.row-t small{display:block;color:var(--muted);font-size:var(--t-xs)}
.goal-form{display:grid;grid-template-columns:1fr auto;gap:var(--s2)}
.goal-form #go-in{grid-column:1/-1}
.goal-form .input{min-width:0}
@media(max-width:420px){.goal-form{grid-template-columns:1fr}}

/* wide screens: the stage stays in view on the left, the loop sits beside it */
@media(min-width:980px){
  #v-home:not([hidden]){display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"stage loop" "stage list";grid-template-rows:auto 1fr;gap:var(--s6) var(--s8);align-items:start;padding-top:var(--s4)}
  .home-stage{grid-area:stage;position:sticky;top:76px}
  #loop{grid-area:loop;padding-top:var(--s7);margin:0}
  #list{grid-area:list}
  .drawer{margin:0}
  .stage{height:min(62vh,580px)}
  #v-home.lamp .cal-bar,#v-home.lamp #day-info{display:flex;visibility:hidden}
  #v-home.lamp #day-info{display:block}
}

/* ---------- about ---------- */
#v-about .lede{color:var(--text);font-size:var(--t-lg)}
.sec{margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--line)}
.sec h2{font-size:var(--t-lg)}
.bullets{margin:var(--s3) 0;padding-left:1.1em;color:var(--muted)}
.bullets li{margin:var(--s2) 0;max-width:62ch}
#v-about>.pair{margin-top:var(--s6)}
#v-about>.hint{margin-top:var(--s4)}
.sec .hint{margin-top:var(--s2)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:max(var(--s5),env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:40;max-width:min(92vw,520px);
  padding:var(--s3) var(--s5);border-radius:14px;background:var(--text);color:var(--bg);font-weight:700;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 16px 40px -18px rgba(0,0,0,.7)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- reduced motion: system setting or the in-app switch ---------- */
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

/* =====================================================================
   The 3D part. One WebGL canvas, two flat-shaded low-poly scenes, and
   every model built here in code (bulb, tiles, trees, rocks, lanterns).
     lamp  the big bulb on its island: the cover, and the focus session
     map   the calendar as an isometric board: one tile per date, twelve
           small lights around each tile
   Without WebGL or Three.js the same information is drawn with HTML and CSS.
   Kept light: instanced meshes, emissive/basic materials, one point light
   per scene, pixel ratio capped at 1.5, about 30 frames per second.
   ===================================================================== */
const scene3 = { mode: 'pending', model: 'code', err: '', dirty: true, labDirty: true };
const STEP = 3.2, TILE = 2.3, TILE_H = 0.42;                 // grid step, tile top size, tile height
const ISO = { yaw: Math.PI / 4, el: Math.atan(Math.SQRT1_2) };   // true isometric angles

/* which scene the canvas should be showing right now */
function stageMode() { return ui.view === 'cover' ? 'cover' : ui.view !== 'home' ? 'none' : (ui.step === 'ready' || ui.step === 'focus') ? 'lamp' : 'map'; }
/* how bright the big bulb should be: off before Start, full while focusing, low when drifting or paused */
function lampTarget() {
  if (ui.view === 'cover') return 1.7;
  if (ui.step !== 'focus' || !T.id) return 0.04;
  if (T.ended) return 1.0;
  if (!T.running) return 0.2;
  return ui.drift ? 0.34 : 2.1;
}
function calModel() {
  const [y, m] = ui.month.split('-').map(Number);
  const off = (new Date(y, m - 1, 1, 12).getDay() + 6) % 7, dim = new Date(y, m, 0).getDate(), rows = Math.ceil((off + dim) / 7);
  const today = dayKey(), cells = [];
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(y, m - 1, 1 - off + i, 12), k = dayKey(d), st = dayStats(k);
    cells.push({
      date: k, num: d.getDate(), col: i % 7, row: Math.floor(i / 7), inMonth: d.getMonth() === m - 1, today: k === today, sel: k === ui.day, future: k > today,
      lit: ui.fly && k === today ? Math.min(st.lit, ui.fly.from) : st.lit,          // the new light stays off until it lands

}
function wdNames() {

}

/* simple calendar: the same dates and the same twelve lights, drawn with HTML and CSS */
function calendar2D(model) {

/* ---------- start-up ---------- */
async function initScene() {
  try {
    const probe = document.createElement('canvas');

    const THREE = await Promise.race([
      import('three'),
      new Promise((_, rej) => setTimeout(() => rej(new Error('three-timeout')), CDN_TIMEOUT))
    ]);
    build3D(THREE);
    scene3.mode = '3d';
    syncScene();
    if (MODEL_OVERRIDE) loadOverride(THREE);
  } catch (err) { to2D(String((err && err.message) || err)); }

}
function to2D(reason) {
  const R = scene3;
  if (R.raf) cancelAnimationFrame(R.raf);
  R.mode = '2d'; R.err = reason; ui.fly = null;
  if (R.cv && R.cv.parentNode) R.cv.parentNode.removeChild(R.cv);
  syncScene();
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  R.glow = new THREE.Color(GLOW);
  R.v3 = new THREE.Vector3(); R.col = new THREE.Color(); R.dummy = new THREE.Object3D();
  R.ray = new THREE.Raycaster(); R.ndc = new THREE.Vector2(); R.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  R.flat = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, metalness: 0, flatShading: true }, extra || {}));
  /* shared materials: one small palette for every prop */
  R.mat = {
    pine: R.flat(0x2f6457), pine2: R.flat(0x3c7b66), bark: R.flat(0x4a3c36), rock: R.flat(0x46506e), rock2: R.flat(0x586287),
    metal: R.flat(0xaab2c6, { roughness: 0.42, metalness: 0.6 }), dark: R.flat(0x262c3f), post: R.flat(0x2b3350),
    lantern: new THREE.MeshBasicMaterial({ color: 0xd99a45 }), light: new THREE.MeshBasicMaterial(),
    frame: new THREE.MeshBasicMaterial({ color: 0xffc15e }), frameSel: new THREE.MeshBasicMaterial({ color: 0xffffff }), flag: new THREE.MeshBasicMaterial({ color: 0xb9a2ff })
  };
  R.geo = { light: new THREE.OctahedronGeometry(0.16, 0) };
  /* a soft halo, drawn once on a small canvas and reused as a sprite */

  const g = hc.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,0.95)'); grad.addColorStop(0.35, 'rgba(255,255,255,0.35)'); grad.addColorStop(1, 'rgba(255,255,255,0)');

}

/* ---------- models, all drawn in code ---------- */
/* The bulb: eight-sided faceted glass turned on a lathe, a filament core on two posts, and a threaded screw base. */
function makeBulb() {

}
function placeLabels() {

  host.classList.toggle('zoomed', c.ppu >= 30);
  M.labs.forEach(el => {
    let x, y, z;
    if (el.dataset.i != null) { const k = M.cells[+el.dataset.i]; x = k.x; z = k.z; y = k.top + 0.02; }
    else { x = (+el.dataset.w - 3) * STEP; z = -(M.rows / 2) * STEP - 0.8; y = 0; }
    v.set(x, y, z).project(M.cam);
    el.style.transform = `translate(${((v.x + 1) / 2 * M.w).toFixed(1)}px,${((1 - v.y) / 2 * M.h).toFixed(1)}px) translate(-50%,-50%)`;

/* Done: a light drops from above, curves in, and lands on the next free spot around today's tile */
function startFly() {
  const M = scene3.map, c = M.today;
  if (!c || !ui.fly) { ui.fly = null; return; }
  const p = lightPos(Math.min(ui.fly.from, LIGHTS - 1));
  ui.fly.started = true;
  M.fly = { t0: 0, to: [c.x + p[0], c.top + 0.17, c.z + p[1]], cell: c };
  sceneGo(c.date);
}

/* ---------- render loop: one canvas, moved to whichever screen needs it ---------- */
function useHost(name, mode) {
  const R = scene3, host = R.hosts[name];

  const w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return false;
  if (R.sizeDirty || w !== R.cw || h !== R.ch) {
    R.cw = w; R.ch = h; R.sizeDirty = false; R.renderer.setSize(w, h, false);
    if (name === 'stage') {
      const M = R.map; M.w = w; M.h = h;

    }

  }

}
function loop(ts) {
  const R = scene3;
  R.raf = requestAnimationFrame(loop);
  const mode = stageMode();

  if (ts - (R.last || 0) < 31) return;                                 // about 30 frames per second is plenty here
  const dt = Math.min(120, ts - (R.last || ts - 33)), ease = ms => 1 - Math.exp(-dt / ms);   // time-based easing: slow machines get the same motion in fewer frames
  R.last = ts;

    const C = R.lamp, tgt = lampTarget(), d = tgt - C.level, cover = mode === 'cover';
    let changed = false;
    if (Math.abs(d) > 0.004) { C.level = anim ? C.level + d * ease(320) : tgt; changed = true; } else if (d !== 0) { C.level = tgt; changed = true; }
    const live = anim && (cover || tgt > 1.5), k = live ? 1 + Math.sin(ts / 1300) * 0.07 : 1, lv = C.level * k;
    if (changed || live || R.dirty) {

      C.light.intensity = lv * 15;

      const base = 0.14 + Math.min(1, C.level / 1.7) * 0.6, lead = Math.floor(ts / 320) % C.N;
      for (let i = 0; i < C.N; i++) { const q = (i - lead + C.N) % C.N; C.ring.setColorAt(i, R.col.copy(R.glow).multiplyScalar(live ? (q === 0 ? base + 0.26 : q < 4 ? base + 0.14 - q * 0.04 : base * 0.6) : base)); }

    const d = M.cg[k] - M.cv[k];
    if (Math.abs(d) > (k === 'ppu' ? 0.02 : 0.001)) { M.cv[k] = anim ? M.cv[k] + d * ease(150) : M.cg[k]; cm = true; }
    else if (d !== 0) { M.cv[k] = M.cg[k]; cm = true; }
  });
  if (cm) { camApply(); moving = true; }
  if (M.fly) {
    const f = M.fly; if (!f.t0) f.t0 = ts + 450;                       // let the camera reach today first
    const u = Math.min(1, Math.max(0, (ts - f.t0) / 1500)), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2, side = Math.sin(Math.PI * e) * 1.8;
    M.orb.visible = M.orbHalo.visible = ts >= f.t0;
    M.orb.position.set(f.to[0] + BASIS.r[0] * side, f.to[1] + (1 - e) * 11, f.to[2] + BASIS.r[2] * side); M.orb.rotation.y = ts / 200;
    M.orbHalo.position.copy(M.orb.position); M.orbHalo.material.opacity = 0.85; M.orbHalo.scale.setScalar(2.6);
    moving = true;
    if (u >= 1) {                                                      // landed: the light turns on, and the tile flashes once
      M.fly = null; ui.fly = null; M.orb.visible = M.orbHalo.visible = false;
      M.flash = { t0: ts, cell: f.cell };
      syncScene();
    }
  }
  if (M.flash) {
    const u = Math.min(1, (ts - M.flash.t0) / 900), c = M.flash.cell;
    M.halo.visible = true; M.halo.position.set(c.x, c.top + 0.4, c.z); M.halo.material.opacity = (1 - u) * 0.8; M.halo.scale.setScalar(2.5 + u * 4.5);
    M.lamp.position.set(c.x, c.top + 1.8, c.z); M.lamp.intensity = (1 - u) * 26;
    moving = true;
    if (u >= 1) { M.flash = null; M.halo.visible = false; M.lamp.intensity = 0; }

}

/* Optional: replace the coded bulb with a GLB. Off unless MODEL_OVERRIDE is set; any failure keeps the coded bulb. */
async function loadOverride(THREE) {
  const R = scene3;
  try {
    const { GLTFLoader } = await import('three/examples/jsm/loaders/GLTFLoader.js');
    const gltf = await new Promise((res, rej) => new GLTFLoader().load(MODEL_OVERRIDE, res, undefined, rej));
    const src = gltf.scene, box = new THREE.Box3().setFromObject(src), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3()), mats = [];
    if (!(size.y > 0)) throw new Error('empty-model');
    src.traverse(o => {
      if (!o.isMesh) return;
      const many = Array.isArray(o.material), own = (many ? o.material : [o.material]).map(m => m.clone());
      o.material = many ? own : own[0];
      own.forEach(m => { if ('flatShading' in m) { m.flatShading = true; m.needsUpdate = true; } if (m.emissive) mats.push(m); });
    });
    if (!mats.length) throw new Error('no-emissive-material');
    src.position.set(-mid.x, -box.min.y, -mid.z);
    const holder = new THREE.Group(); holder.add(src); holder.scale.setScalar(1.8 / size.y);
    const b = R.lamp.bulb; while (b.group.children.length) b.group.remove(b.group.children[0]);
    b.group.add(holder); b.mats = mats; R.model = 'glb'; R.dirty = true;
  } catch (err) { R.model = 'code'; R.modelErr = String((err && err.message) || err); }

}

/* ---------- wiring ---------- */
function bindEvents() {
  document.addEventListener('click', e => {
    if (ui.drift && T.id && ui.view === 'home') { here(); return; }      // while the light is low, any tap means "I'm here" and nothing else
    const el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    const f = ACT[el.dataset.act]; if (f) f(el.dataset, el);
  });
  document.addEventListener('change', e => { const el = e.target, f = el.dataset && CHG[el.dataset.chg]; if (f) f(el); });
  document.addEventListener('input', e => { const el = e.target, f = el.dataset && BIND[el.dataset.bind]; if (f) f(el.value); });
  document.addEventListener('submit', e => { const f = e.target.dataset && FORMS[e.target.dataset.form]; if (f) { e.preventDefault(); f(e.target); } });
  document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.keep; if (k) ui.open[k] = e.target.open; }, true);
  /* anything that shows the person is here resets the idle clock */
  const active = () => { lastActive = Date.now(); };
  ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(ev => window.addEventListener(ev, active, { passive: true }));
  document.addEventListener('visibilitychange', () => {

    if (mq.addEventListener) mq.addEventListener('change', on); else if (mq.addListener) mq.addListener(on);

  let day = dayKey();
  setInterval(() => { if (day !== dayKey()) { day = dayKey(); ui.day = day; ui.month = day.slice(0, 7); if (ui.view === 'home' && ui.step !== 'focus') render(); } }, 30000);
}
function boot() {
  load();
  ui.day = dayKey(); ui.month = ui.day.slice(0, 7);
  bindEvents();
  const hash = (location.hash || '').slice(1);
  nav(hash === 'home' || hash === 'about' ? hash : 'cover');          // a plain visit always opens on the cover
  initScene();
  window.__enfoco = { get state() { return S; }, timer: T, scene: scene3, ui, idle() { lastActive = 0; } };   // small debugging handle
}
boot();
